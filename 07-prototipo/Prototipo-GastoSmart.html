<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GastoSmart — Control inteligente de tus gastos</title>
<meta name="description" content="GastoSmart: app de control de gastos personales. Prototipo funcional del grupo QWERTY123 — Metodología de Sistemas.">
<meta name="theme-color" content="#16a34a">
<meta property="og:type" content="website">
<meta property="og:title" content="GastoSmart — Control inteligente de tus gastos">
<meta property="og:description" content="Prototipo funcional de la app de control de gastos. Grupo QWERTY123 · Metodología de Sistemas.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2316a34a'/%3E%3Ctext x='50' y='72' font-size='64' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3E$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#16a34a; --green-600:#15803d; --green-soft:#e6f4ea;
  --bg:#f3f4f6; --card:#ffffff; --ink:#0f1419; --ink-2:#39424a; --muted:#6b7280;
  --line:#e7e9ec; --line-2:#f0f1f3; --track:#e9ebee;
  --red:#dc2626; --red-soft:#fdecec; --amber:#f59e0b; --shadow:0 1px 2px rgba(15,20,25,.06),0 8px 24px rgba(15,20,25,.05);
}
[data-theme="dark"]{
  --green:#22c55e; --green-600:#16a34a; --green-soft:#152a1d;
  --bg:#0c1014; --card:#151b21; --ink:#eef2f5; --ink-2:#c3ccd3; --muted:#8b97a1;
  --line:#222a31; --line-2:#1b2228; --track:#242c33;
  --red:#f87171; --red-soft:#2a1717; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:#0d1117; color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
body::before{
  content:""; position:fixed; inset:0;
  background:
    radial-gradient(900px 600px at 15% 10%, #14301f 0%, transparent 60%),
    radial-gradient(700px 500px at 85% 90%, #10233a 0%, transparent 60%),
    #0d1117;
  z-index:0;
}
.frame{
  position:relative; z-index:1;
  width:100%; max-width:432px; height:100dvh; max-height:100dvh;
  background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
}
@media (min-width:560px) and (min-height:700px){
  .frame{height:min(896px,94dvh); border-radius:34px; box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 9px #1b2127,0 0 0 10px #2c343c}
}
.desk-note{
  position:fixed; left:22px; bottom:18px; max-width:230px; margin:0; text-align:left;
  color:#5d6b77; font-size:12px; line-height:1.5; z-index:2; display:none;
}
@media (min-width:1100px){.desk-note{display:block}}

/* ---------- header ---------- */
.top{
  flex:none; padding:14px 18px 10px; background:var(--card);
  border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px;
  padding-top:max(14px,env(safe-area-inset-top));
}
.top h1{font-size:19px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.02em}
.top .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.brandmark{width:34px;height:34px;border-radius:10px;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none}
.topacts{margin-left:auto;display:flex;gap:8px;flex:none}
.iconbtn{
  flex:none; width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:var(--card); color:var(--ink-2); display:grid;place-items:center;cursor:pointer;position:relative
}
.iconbtn svg{width:20px;height:20px}
.iconbtn:active{background:var(--line-2)}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* ---------- screen ---------- */
.screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:16px 16px 110px;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:14px}
.sec{margin:20px 0 9px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:14.5px;margin:0;font-weight:650;letter-spacing:-.01em}
.sec a{margin-left:auto;font-size:12.5px;color:var(--green);font-weight:600;cursor:pointer;text-decoration:none}
.muted{color:var(--muted)}
.hero{
  background:linear-gradient(158deg,var(--green) 0%,var(--green-600) 100%);
  color:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 10px 24px rgba(22,163,74,.28)
}
.hero .lbl{font-size:12.5px;opacity:.92}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.hero .foot{display:flex;align-items:center;gap:8px;font-size:12.5px;opacity:.95}
.chip{background:rgba(255,255,255,.18);padding:3px 8px;border-radius:20px;font-weight:600;display:inline-flex;gap:4px;align-items:center}

.row{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}
.row:active{background:var(--line-2)}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff}
.ic svg{width:19px;height:19px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:11.5px;color:var(--muted)}
.row > svg{width:18px;height:18px;color:var(--muted);flex:none}
.amt{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.amt.in{color:var(--green)}
.amt small{display:block;font-size:11px;font-weight:500;color:var(--muted)}

.bar{display:block;height:7px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .45s cubic-bezier(.3,.9,.3,1)}
.daylbl{font-size:11.5px;font-weight:650;color:var(--muted);margin:16px 4px 7px;text-transform:none}

.tabs{display:flex;gap:6px;background:var(--line-2);padding:4px;border-radius:12px;margin-bottom:4px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:9px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 14px}
.mnav b{font-size:15.5px;font-weight:650}
.nudge svg{width:18px;height:18px}
.nudge{border:1px solid var(--line);background:var(--card);width:34px;height:34px;border-radius:11px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0;border-radius:13px;background:var(--green);color:#fff;
  font:inherit;font-size:14.5px;font-weight:650;padding:13px 18px;cursor:pointer;width:100%
}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{background:var(--green-600)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--green-soft);color:var(--green-600)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:11px;width:auto}

.alert{display:flex;gap:11px;padding:12px 14px;border-radius:14px;background:var(--red-soft);color:var(--red);font-size:13px;line-height:1.45;align-items:flex-start}
.alert.tip{background:var(--green-soft);color:var(--green-600)}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px}
.alert b{display:block;margin-bottom:2px}

/* ---------- bottom nav ---------- */
.nav{
  flex:none;position:relative;background:var(--card);border-top:1px solid var(--line);
  display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom)
}
.nav button{
  flex:1;border:0;background:transparent;padding:9px 0 10px;display:grid;gap:3px;justify-items:center;
  font:inherit;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer
}
.nav button svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:var(--green)}
.nav button.fab{
  position:absolute;left:50%;top:-22px;transform:translateX(-50%);
  width:56px;height:56px;border-radius:50%;border:4px solid var(--card);background:var(--green);
  color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px rgba(22,163,74,.42)
}
.nav button.fab svg{width:26px;height:26px}
.nav button.fab:active{background:var(--green-600)}
.nav .spacer{flex:1}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,16,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@media (min-width:560px){.scrim{align-items:center}}
.sheet{
  width:100%;max-width:432px;max-height:92dvh;overflow-y:auto;background:var(--card);
  border-radius:22px 22px 0 0;padding:6px 18px calc(22px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.25,1,.35,1)
}
@media (min-width:560px){.sheet{border-radius:20px;max-height:88dvh;margin:0 12px}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 12px}
.sheet h3{margin:2px 0 14px;font-size:18px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.sheet h3 svg{width:20px;height:20px;flex:none}
.sheet h3 .x svg{width:16px;height:16px}
.sheet h3 .x{margin-left:auto;border:0;background:var(--line-2);color:var(--ink-2);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
@keyframes up{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}.bar i{transition:none}}

label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input,select,textarea{
  width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;outline:0
}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
.money{font-size:26px;font-weight:750;letter-spacing:-.02em;padding:14px;font-variant-numeric:tabular-nums}
.hint{font-size:11.5px;color:var(--green-600);margin-top:6px;display:flex;gap:5px;align-items:center}
.hint svg{width:13px;height:13px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{
  border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:11px 4px;cursor:pointer;
  font:inherit;font-size:11px;font-weight:600;color:var(--ink-2);display:grid;gap:5px;justify-items:center
}
.pick button svg{width:19px;height:19px}
.pick button[aria-pressed="true"]{border-color:currentColor;background:var(--line-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.kv:first-of-type{border-top:0}
.kv b{font-weight:650}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--green-soft);color:var(--green-600)}
.pill.over{background:var(--red-soft);color:var(--red)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px;line-height:1.6}
.empty svg{width:34px;height:34px;margin-bottom:10px;opacity:.5}
table.cmp{width:100%;border-collapse:collapse;font-size:12px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line-2);padding:8px 6px;text-align:left;vertical-align:top}
table.cmp th{font-weight:650;color:var(--muted);font-size:11px}
table.cmp td.yes{color:var(--green-600);font-weight:650}
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:12px;font-size:13.5px;font-weight:600;
  z-index:60;box-shadow:0 10px 26px rgba(0,0,0,.3);animation:up .2s ease;max-width:86%;text-align:center
}
ul.tight{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.65;color:var(--ink-2)}
ul.tight li{margin-bottom:3px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;text-align:center}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.stat b{display:block;font-size:17px;font-weight:750;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--muted)}
.wg{background:#11161b;border-radius:18px;padding:14px;color:#e8edf1;border:1px solid #222a31}
.wg .wt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin-bottom:10px}
.wg input{background:#1b2228;border-color:#2c343c;color:#fff}
</style>
</head>
<body>
<div class="frame">
  <header class="top" id="top"></header>
  <main class="screen" id="screen"></main>
  <nav class="nav" id="nav"></nav>
</div>
<div id="modal"></div>
<p class="desk-note">Prototipo funcional — GastoSmart · Grupo QWERTY123 · Los datos se guardan en este navegador</p>

<script>
"use strict";
/* =========================================================
   GastoSmart — prototipo funcional
   Grupo QWERTY123 · Metodología de Sistemas
   Todo el estado vive en localStorage (sin backend).
   ========================================================= */

/* ---------- iconos ---------- */
const P = {
  home:'<path d="M3 10.6 12 3.3l9 7.3"/><path d="M5.4 9.6V20h13.2V9.6"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.6" cy="6" r="1.1"/><circle cx="3.6" cy="12" r="1.1"/><circle cx="3.6" cy="18" r="1.1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  wallet:'<path d="M3 7.5h15.5A2.5 2.5 0 0 1 21 10v7.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7.5v-1A2 2 0 0 1 5 4.5h11.5v3"/><circle cx="17" cy="13.7" r="1.2"/>',
  target:'<circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1.3"/>',
  user:'<circle cx="12" cy="8" r="3.9"/><path d="M4.4 20.6c0-3.7 3.4-5.6 7.6-5.6s7.6 1.9 7.6 5.6"/>',
  bell:'<path d="M18 8.4a6 6 0 0 0-12 0c0 6.6-2.6 7.8-2.6 7.8h17.2S18 15 18 8.4"/><path d="M10.2 19.8a2 2 0 0 0 3.6 0"/>',
  utensils:'<path d="M7 3.2v7.4a2.1 2.1 0 0 0 4.2 0V3.2"/><path d="M9.1 10.6V20.8"/><path d="M16.4 20.8V3.2c2.3 1 3.4 3 3.4 5.2s-1.1 3.4-3.4 3.6"/>',
  bus:'<rect x="4" y="3.6" width="16" height="12.4" rx="2.4"/><path d="M4 10.4h16"/><circle cx="7.8" cy="19" r="1.6"/><circle cx="16.2" cy="19" r="1.6"/>',
  cart:'<circle cx="9.5" cy="19.6" r="1.5"/><circle cx="17.8" cy="19.6" r="1.5"/><path d="M2.6 3.4h2.8L8 15.4h11L21.4 7H6.2"/>',
  film:'<rect x="3.2" y="5" width="17.6" height="14" rx="2.4"/><path d="M8.4 5v14M15.6 5v14M3.2 12h17.6"/>',
  bulb:'<path d="M9.4 18.6h5.2M10.4 21.4h3.2"/><path d="M12 2.8a6.1 6.1 0 0 0-3.3 11.2v2.2h6.6V14A6.1 6.1 0 0 0 12 2.8z"/>',
  more:'<circle cx="5.2" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18.8" cy="12" r="1.5"/>',
  alert:'<path d="M12 3.4 2.3 20.4h19.4z"/><path d="M12 9.4v4.8"/><circle cx="12" cy="17.4" r=".9"/>',
  check:'<circle cx="12" cy="12" r="8.8"/><path d="m8 12.2 2.9 2.9L16.2 9"/>',
  trash:'<path d="M4 6.6h16"/><path d="M9.4 6.6V3.8h5.2v2.8"/><path d="M6.2 6.6 7.3 20.4h9.4l1.1-13.8"/>',
  pencil:'<path d="M4 20.2h4.2L20.4 8 16.2 3.8 4 16z"/>',
  cal:'<rect x="3.2" y="5" width="17.6" height="15.8" rx="2.4"/><path d="M8 2.8v4.4M16 2.8v4.4M3.2 11h17.6"/>',
  left:'<path d="M14.8 5.6 8.4 12l6.4 6.4"/>',
  right:'<path d="M9.2 5.6 15.6 12l-6.4 6.4"/>',
  down:'<path d="m6.4 9.4 5.6 5.6 5.6-5.6"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  save:'<path d="M12 3.4v11.8"/><path d="m7 10.6 5 5 5-5"/><path d="M4 20.6h16"/>',
  zap:'<path d="M13.4 2.4 4.6 14.2h5.6l-1.2 7.4 9-11.8h-5.6z"/>',
  up:'<path d="m3.4 17 6.2-6.2 4 4 7-7"/><path d="M15.4 7.8h5.2V13"/>',
  info:'<circle cx="12" cy="12" r="8.8"/><path d="M12 11v5.4"/><circle cx="12" cy="7.9" r=".9"/>',
  moon:'<path d="M20.4 14.2A8.6 8.6 0 0 1 9.8 3.6a8.8 8.8 0 1 0 10.6 10.6z"/>',
  flag:'<path d="M5.4 21V3.6h10l-1.4 3.6 1.4 3.6h-10"/>',
  piggy:'<ellipse cx="12" cy="6.4" rx="6.8" ry="2.7"/><path d="M5.2 6.4v4.3c0 1.5 3 2.7 6.8 2.7s6.8-1.2 6.8-2.7V6.4"/><path d="M5.2 10.7v4.3c0 1.5 3 2.7 6.8 2.7s6.8-1.2 6.8-2.7v-4.3"/>',
  gift:'<rect x="3.4" y="8.6" width="17.2" height="11.8" rx="2"/><path d="M3.4 13h17.2M12 8.6v11.8"/><path d="M12 8.6C10.4 5.2 8.2 4.8 7.4 6.2c-.8 1.5 1.4 2.4 4.6 2.4z"/><path d="M12 8.6c1.6-3.4 3.8-3.8 4.6-2.4.8 1.5-1.4 2.4-4.6 2.4z"/>',
  shield:'<path d="M12 3.2 4.6 6v6c0 4.4 3.2 7.4 7.4 8.8 4.2-1.4 7.4-4.4 7.4-8.8V6z"/>',
  logout:'<path d="M15 4.4H6.4A2 2 0 0 0 4.4 6.4v11.2a2 2 0 0 0 2 2H15"/><path d="M18.6 12H9.8m5.4-3.6L18.6 12l-3.4 3.6"/>'
};
const ico = (n, cls='') => '<svg class="'+cls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(P[n]||'')+'</svg>';

/* ---------- categorías ---------- */
const CATS = {
  comida:         {label:'Comida',          color:'#16a34a', icon:'utensils'},
  transporte:     {label:'Transporte',      color:'#7c3aed', icon:'bus'},
  supermercado:   {label:'Supermercado',    color:'#0891b2', icon:'cart'},
  entretenimiento:{label:'Entretenimiento', color:'#f97316', icon:'film'},
  servicios:      {label:'Servicios',       color:'#2563eb', icon:'bulb'},
  otros:          {label:'Otros',           color:'#6b7280', icon:'more'}
};
const CK = Object.keys(CATS);
const INCATS = {
  sueldo: {label:'Sueldo',    color:'#16a34a', icon:'wallet'},
  extra:  {label:'Changas',   color:'#0891b2', icon:'zap'},
  venta:  {label:'Venta',     color:'#7c3aed', icon:'up'},
  regalo: {label:'Regalo',    color:'#f97316', icon:'gift'},
  otros:  {label:'Otros',     color:'#6b7280', icon:'more'}
};
const IK = Object.keys(INCATS);
const setDe = tipo => tipo==='ingreso' ? INCATS : CATS;
const catDe = t => (t.tipo==='ingreso' ? (INCATS[t.cat]||INCATS.otros) : (CATS[t.cat]||CATS.otros));

/* Categorización automática por palabras clave (el "algoritmo" del canvas) */
const KEYS = {
  supermercado:['super','supermercado','dia','carrefour','coto','vea','jumbo','chango','almacen','verduleria','carniceria','atomo','oscar david'],
  comida:['cafe','almuerzo','cena','desayuno','resto','restaurante','pizza','burger','mcdonald','empanada','helado','bar','kiosco','panaderia','delivery','pedidos','rappi','merienda'],
  transporte:['uber','cabify','didi','taxi','remis','nafta','combustible','shell','ypf','axion','colectivo','sube','peaje','estacionamiento','cochera','pasaje','micro','tren'],
  entretenimiento:['cine','teatro','steam','juego','playstation','xbox','salida','boliche','recital','entrada','futbol','cancha','libro','streaming','disney','hbo','max'],
  servicios:['netflix','spotify','luz','gas','agua','internet','edemsa','ecogas','aysam','movistar','claro','personal','telefono','celular','alquiler','expensas','seguro','cuota','suscripcion','chatgpt','plan']
};
function autoCat(txt){
  const t = (txt||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const words = t.split(/[^a-z0-9]+/).filter(Boolean);
  if(!words.length) return null;
  for(const c of CK){
    const ws = KEYS[c]; if(!ws) continue;
    for(const w of ws){
      for(const p of words){
        // palabra exacta, o prefijo largo (super -> supermercado) para evitar falsos positivos (bar -> barrio)
        if(p===w || (w.length>=5 && p.startsWith(w))) return c;
      }
    }
  }
  return null;
}

const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mkey = s => s.slice(0,7);
const today = () => iso(new Date());
function mLabel(k){ const [y,m]=k.split('-'); return MESES[+m-1].replace(/^./,c=>c.toUpperCase())+' '+y; }
function dLabel(s){
  const t=new Date(); const y=new Date(t.getTime()-864e5);
  if(s===iso(t)) return 'Hoy';
  if(s===iso(y)) return 'Ayer';
  const [Y,M,D]=s.split('-'); return (+D)+' '+MESC[+M-1]+(+Y!==t.getFullYear()?' '+Y:'');
}
function shiftMonth(k,d){ const [y,m]=k.split('-').map(Number); const dt=new Date(y,m-1+d,1); return dt.getFullYear()+'-'+pad(dt.getMonth()+1); }

const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- cálculos ---------- */
const inMes = (t,k) => mkey(t.fecha)===k;
const gastos = k => S.tx.filter(t=>t.tipo==='gasto' && inMes(t,k));
const ingresos = k => S.tx.filter(t=>t.tipo==='ingreso' && inMes(t,k));
const suma = a => a.reduce((x,t)=>x+ (+t.monto||0),0);
function porCat(k){
  const o={}; CK.forEach(c=>o[c]=0);
  gastos(k).forEach(t=>{ o[t.cat!==undefined&&CATS[t.cat]?t.cat:'otros'] += (+t.monto||0); });
  return o;
}
function alertas(k){
  const p=presuDe(k), g=porCat(k), out=[];
  CK.forEach(c=>{
    if(!p[c]) return;
    const pc = g[c]/p[c]*100;
    if(pc>100) out.push({t:'over',cat:c,txt:'Superaste el presupuesto de '+CATS[c].label+' ('+Math.round(pc)+'%). Llevás '+money(g[c])+' de '+money(p[c])+'.'});
    else if(pc>=85) out.push({t:'near',cat:c,txt:'Vas al '+Math.round(pc)+'% del presupuesto de '+CATS[c].label+'. Te quedan '+money(p[c]-g[c])+'.'});
  });
  S.metas.forEach(m=>{
    const pc=m.ahorrado/m.objetivo*100;
    if(pc>=100) out.push({t:'meta',txt:'¡Alcanzaste la meta "'+m.nombre+'"!'});
    else if(pc>=75) out.push({t:'meta',txt:'Te falta '+money(m.objetivo-m.ahorrado)+' para "'+m.nombre+'". Vas al '+Math.round(pc)+'%.'});
  });
  const tg=suma(gastos(k)), tp=Object.values(p).reduce((a,b)=>a+b,0), ing=suma(ingresos(k));
  if(tp && tg/tp>=1) out.push({t:'over',txt:'Ya usaste todo el presupuesto del mes. Revisá tus gastos antes de seguir.'});
  if(ing && tg>ing) out.push({t:'over',txt:'Gastaste '+money(tg-ing)+' más de lo que ingresó este mes.'});
  if(ing && tp>ing) out.push({t:'near',txt:'Tus presupuestos suman '+money(tp)+' pero este mes ingresaron '+money(ing)+'. Conviene ajustarlos.'});
  return out;
}

/* ---------- donut ---------- */
function donut(k){
  const g=porCat(k), total=Object.values(g).reduce((a,b)=>a+b,0);
  const R=54, C=2*Math.PI*R; let off=0;
  let arcs = total ? CK.filter(c=>g[c]>0).map(c=>{
    const frac=g[c]/total, len=C*frac, s='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+CATS[c].color+'" stroke-width="17" stroke-linecap="butt" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
    off+=len; return s;
  }).join('') : '<circle cx="70" cy="70" r="54" fill="none" stroke="var(--track)" stroke-width="17"/>';
  const svg='<svg viewBox="0 0 140 140" width="132" height="132" style="transform:rotate(-90deg);flex:none">'+arcs+'</svg>';
  const leg = CK.filter(c=>g[c]>0).sort((a,b)=>g[b]-g[a]).map(c=>
    '<div style="display:flex;align-items:center;gap:7px;font-size:12.5px;padding:3px 0">'+
      '<i style="width:9px;height:9px;border-radius:50%;background:'+CATS[c].color+';flex:none"></i>'+
      '<span style="flex:1">'+CATS[c].label+'</span>'+
      '<b style="font-variant-numeric:tabular-nums">'+Math.round(g[c]/total*100)+'%</b>'+
    '</div>').join('') || '<p class="muted" style="font-size:13px;margin:0">Todavía no hay gastos este mes.</p>';
  return '<div class="card pad" style="display:flex;gap:14px;align-items:center">'+
    '<div style="position:relative;display:grid;place-items:center">'+svg+
      '<div style="position:absolute;text-align:center"><b style="font-size:15px;font-variant-numeric:tabular-nums;display:block">'+money(total)+'</b><span style="font-size:10.5px;color:var(--muted)">Total</span></div>'+
    '</div><div style="flex:1;min-width:0">'+leg+'</div></div>';
}

function sheet(title,body,icon){
  document.getElementById('modal').innerHTML =
    '<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+
    '<h3>'+(icon?ico(icon):'')+esc(title)+'<button class="x" data-close="1" aria-label="Cerrar">'+ico('x')+'</button></h3>'+

function closeSheet(){ document.getElementById('modal').innerHTML=''; }
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(),2200);
}

function mNuevo(pre){
  const cat = pre&&pre.cat || 'comida';
  const picker = (tipo,sel) => Object.keys(setDe(tipo)).map(c=>{
    const o=setDe(tipo)[c];
    return '<button data-c="'+c+'" aria-pressed="'+(c===sel)+'" style="color:'+o.color+'">'+ico(o.icon)+'<span style="color:var(--ink-2)">'+o.label+'</span></button>';
  }).join('');
  sheet('Nuevo movimiento',
    '<div class="tabs" id="tt">'+['gasto','ingreso'].map(x=>'<button data-tt="'+x+'" aria-pressed="'+(x==='gasto')+'">'+(x==='gasto'?'Gasto':'Ingreso')+'</button>').join('')+'</div>'+
    '<label class="f">Monto</label><input id="f-monto" class="money" inputmode="decimal" placeholder="$ 0" value="'+(pre&&pre.monto||'')+'">'+
    '<label class="f" id="f-lbl-desc">Descripción</label><input id="f-desc" placeholder="Ej: Supermercado, Uber, Netflix…" value="'+esc(pre&&pre.desc||'')+'"><div id="f-hint"></div>'+
    '<label class="f">Categoría</label><div class="pick" id="f-cat">'+picker('gasto',cat)+'</div>'+
    '<div class="two"><div><label class="f">Fecha</label><input id="f-fecha" type="date" value="'+today()+'"></div>'+
    '<div><label class="f">Pago</label><select id="f-pago">'+PAGOS.map(p=>'<option>'+p+'</option>').join('')+'</select></div></div>'+
    '<div style="margin-top:20px"><button class="btn" id="f-save">'+ico('save')+'Guardar gasto</button></div>','plus');

  const hint=document.getElementById('f-hint');
  document.getElementById('f-desc').addEventListener('input',e=>{
    if(document.querySelector('#tt button[aria-pressed="true"]').dataset.tt==='ingreso'){ hint.innerHTML=''; return; }
    const c=autoCat(e.target.value);
    if(c){ setPick(c); hint.innerHTML='<div class="hint">'+ico('zap')+'Categoría detectada: '+CATS[c].label+'</div>'; }
    else hint.innerHTML='';
  });
  document.getElementById('f-cat').addEventListener('click',e=>{
    const b=e.target.closest('[data-c]'); if(b) setPick(b.dataset.c);
  });
  document.getElementById('tt').addEventListener('click',e=>{
    const b=e.target.closest('[data-tt]'); if(!b) return;
    [...document.querySelectorAll('#tt button')].forEach(x=>x.setAttribute('aria-pressed', x===b));
    const tipo=b.dataset.tt, ing=tipo==='ingreso';
    document.getElementById('f-cat').innerHTML = picker(tipo, ing?'sueldo':'comida');
    document.getElementById('f-desc').placeholder = ing? 'Ej: Sueldo, changa, venta…' : 'Ej: Supermercado, Uber, Netflix…';
    document.getElementById('f-hint').innerHTML='';
    document.getElementById('f-save').lastChild.textContent = ing? 'Guardar ingreso' : 'Guardar gasto';
  });
  document.getElementById('f-save').addEventListener('click',()=>{
    const monto=parseFloat(String(document.getElementById('f-monto').value).replace(/[^\d.,-]/g,'').replace(/\./g,'').replace(',','.'));
    if(!monto || monto<=0){ toast('Ingresá un monto válido'); return; }
    const tipo=document.querySelector('#tt button[aria-pressed="true"]').dataset.tt;
    const cat=(document.querySelector('#f-cat button[aria-pressed="true"]')||{dataset:{c:'otros'}}).dataset.c;
    S.tx.push({id:uid(),tipo,monto,cat,desc:document.getElementById('f-desc').value.trim()||setDe(tipo)[cat].label,
      fecha:document.getElementById('f-fecha').value||today(),pago:document.getElementById('f-pago').value});
    save(); closeSheet(); render(); toast(tipo==='gasto'?'Gasto guardado':'Ingreso guardado');
  });
  function setPick(c){ [...document.querySelectorAll('#f-cat button')].forEach(b=>b.setAttribute('aria-pressed', b.dataset.c===c)); }
  setTimeout(()=>document.getElementById('f-monto').focus(),80);
}

function mPresu(){
  const p=presuDe(mes), ingMes=suma(ingresos(mes));
  const REPARTO={comida:.16,supermercado:.16,transporte:.09,servicios:.09,entretenimiento:.17,otros:.13};
  sheet('Presupuestos de '+mLabel(mes),
    CK.map(c=>'<label class="f" style="display:flex;align-items:center;gap:8px;margin-top:12px"><i style="width:10px;height:10px;border-radius:50%;background:'+CATS[c].color+'"></i>'+CATS[c].label+'</label>'+
      '<input class="p-in" data-c="'+c+'" inputmode="numeric" value="'+(p[c]||0)+'">').join('')+
    '<div style="margin-top:20px"><button class="btn" id="p-save">'+ico('check')+'Guardar presupuestos</button>'+
    (ingMes? '<button class="btn ghost" id="p-auto" style="margin-top:9px">'+ico('zap')+'Repartir mis ingresos ('+money(ingMes)+')</button>' : '')+'</div>'+
    '<p class="muted" style="font-size:11.5px;margin:10px 2px 0;line-height:1.5">'+
      (ingMes? 'Repartir usa la regla 50/30/20: la mitad para gastos fijos, 30% para gustos y el 20% restante queda libre para tus metas.'
             : 'Cargá tus ingresos del mes y la app puede repartirlos sola entre las categorías.')+
    '</p>','wallet');
  const auto=document.getElementById('p-auto');
  if(auto) auto.addEventListener('click',()=>{
    document.querySelectorAll('.p-in').forEach(i=>{ i.value=Math.round(ingMes*(REPARTO[i.dataset.c]||0)/500)*500; });
    toast('Reparto sugerido, revisalo y guardá');
  });
  document.getElementById('p-save').addEventListener('click',()=>{
    const o={}; document.querySelectorAll('.p-in').forEach(i=>{ o[i.dataset.c]=Math.max(0,parseFloat(String(i.value).replace(/[^\d]/g,''))||0); });
    S.presu[mes]=o; save(); closeSheet(); render(); toast('Presupuestos actualizados');
  });
}

function mMeta(id){
  const m = id? S.metas.find(x=>x.id===id) : null;
  sheet(m?'Editar meta':'Nueva meta',
    '<label class="f">Nombre</label><input id="m-nom" placeholder="Ej: Viaje a Bariloche" value="'+esc(m?m.nombre:'')+'">'+
    '<div class="two"><div><label class="f">Objetivo</label><input id="m-obj" inputmode="numeric" value="'+(m?m.objetivo:'')+'" placeholder="500000"></div>'+
    '<div><label class="f">Ya ahorrado</label><input id="m-aho" inputmode="numeric" value="'+(m?m.ahorrado:0)+'"></div></div>'+
    '<div class="two"><div><label class="f">Fecha objetivo</label><input id="m-fec" type="date" value="'+(m&&m.fecha||'')+'"></div>'+
    '<div><label class="f">Emoji</label><input id="m-emo" maxlength="4" value="'+(m&&m.emoji||'🎯')+'"></div></div>'+
    '<div style="margin-top:20px"><button class="btn" id="m-save">'+ico('check')+(m?'Guardar cambios':'Crear meta')+'</button>'+
    (m?'<button class="btn danger" data-act="delmeta" data-id="'+m.id+'" style="margin-top:9px">'+ico('trash')+'Eliminar meta</button>':'')+'</div>','target');
  document.getElementById('m-save').addEventListener('click',()=>{
    const nom=document.getElementById('m-nom').value.trim();
    const obj=parseFloat(String(document.getElementById('m-obj').value).replace(/[^\d]/g,''))||0;
    const aho=parseFloat(String(document.getElementById('m-aho').value).replace(/[^\d]/g,''))||0;
    if(!nom||!obj){ toast('Poné un nombre y un objetivo'); return; }
    const o={nombre:nom,objetivo:obj,ahorrado:aho,fecha:document.getElementById('m-fec').value,emoji:document.getElementById('m-emo').value||'🎯'};
    if(m) Object.assign(m,o); else S.metas.push(Object.assign({id:uid()},o));
    save(); closeSheet(); render(); toast(m?'Meta actualizada':'Meta creada');
  });
}

function mAportar(id){
  const m=S.metas.find(x=>x.id===id); if(!m) return;
  const falta=Math.max(0,m.objetivo-m.ahorrado);
  sheet('Aportar a '+m.nombre,
    '<p class="muted" style="font-size:12.5px;margin:-6px 0 4px">Faltan '+money(falta)+' para llegar al objetivo.</p>'+
    '<label class="f">Monto a aportar</label><input id="a-monto" class="money" inputmode="decimal" placeholder="$ 0">'+
    '<div style="margin-top:18px"><button class="btn" id="a-save">'+ico('piggy')+'Sumar al ahorro</button></div>','piggy');
  document.getElementById('a-save').addEventListener('click',()=>{
    const v=parseFloat(String(document.getElementById('a-monto').value).replace(/[^\d.,-]/g,'').replace(/\./g,'').replace(',','.'));
    if(!v||v<=0){ toast('Ingresá un monto'); return; }
    m.ahorrado=Math.max(0,m.ahorrado+v); save(); closeSheet(); render();
    toast(m.ahorrado>=m.objetivo? '¡Meta cumplida! 🎉' : money(v)+' sumados a la meta');
  });
  setTimeout(()=>document.getElementById('a-monto').focus(),80);
}

function mNotis(){
  const al=alertas(mkey(today()));
  sheet('Alertas inteligentes',
    (al.length? al.map(a=>'<div class="alert '+(a.t==='over'?'':'tip')+'" style="margin-bottom:9px">'+ico(a.t==='over'?'alert':a.t==='meta'?'target':'info')+'<span>'+esc(a.txt)+'</span></div>').join('')
      : '<div class="empty">'+ico('check')+'<p style="margin:0">Todo en orden. No hay alertas este mes.</p></div>')+
    '<p class="muted" style="font-size:11.5px;margin:8px 2px 0;line-height:1.5">Las alertas se generan solas comparando tus gastos con los presupuestos y el avance de tus metas.</p>','bell');
}

function mNombre(){
  sheet('Tu nombre','<label class="f">¿Cómo querés que te llamemos?</label><input id="n-in" value="'+esc(S.user.nombre)+'">'+
    '<div style="margin-top:18px"><button class="btn" id="n-save">'+ico('check')+'Guardar</button></div>','user');
  document.getElementById('n-save').addEventListener('click',()=>{
    const v=document.getElementById('n-in').value.trim(); if(!v){toast('Escribí un nombre');return;}
    S.user.nombre=v; save(); closeSheet(); render(); toast('Listo, '+v);
  });
}

/* ---------- export ---------- */
function baja(nombre,txt,mime){
  const b=new Blob([txt],{type:mime}), u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function exportar(f){
  if(f==='csv'){
    const rows=[['Fecha','Tipo','Descripcion','Categoria','Medio de pago','Monto']]
      .concat([...S.tx].sort((a,b)=>a.fecha<b.fecha?1:-1).map(t=>[t.fecha,t.tipo,(t.desc||'').replace(/"/g,"'"),(CATS[t.cat]||CATS.otros).label,t.pago||'',t.monto]));
    baja('gastosmart-movimientos.csv','\ufeff'+rows.map(r=>r.map(c=>'"'+c+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8');
    toast('CSV descargado');
  } else {
    baja('gastosmart-backup.json', JSON.stringify(S,null,2),'application/json');
    toast('Copia de seguridad descargada');
  }
}

/* =========================================================
   EVENTOS
   ========================================================= */
document.addEventListener('click',e=>{
  const closer=e.target.closest('[data-close]');
  if(closer){
    if(closer.classList.contains('scrim')){ if(e.target===closer){ closeSheet(); return; } }
    else { closeSheet(); return; }
  }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  switch(a){
    case 'empezar': S.bienvenida=1; save(); closeSheet(); break;
    case 'ir': view=el.dataset.v; closeSheet(); render(); break;
    case 'tab': tab=el.dataset.t; render(); break;
    case 'mes': mes=shiftMonth(mes, +el.dataset.d); render(); break;
    case 'nuevo': mNuevo(); break;
    case 'widget': mWidget(); break;
    case 'notis': mNotis(); break;
    case 'tx': mTx(id); break;
    case 'edittx': mEditTx(id); break;
    case 'deltx':
      S.tx=S.tx.filter(t=>t.id!==id); save(); closeSheet(); render(); toast('Movimiento eliminado'); break;
    case 'editpresu': mPresu(); break;
    case 'nuevameta': mMeta(null); break;
    case 'editmeta': mMeta(id); break;
    case 'delmeta':
      S.metas=S.metas.filter(m=>m.id!==id); save(); closeSheet(); render(); toast('Meta eliminada'); break;
    case 'aportar': mAportar(id); break;
    case 'editnombre': mNombre(); break;
    case 'proyecto': view='proyecto'; render(); break;
    case 'tema':
      S.tema = S.tema==='dark'?'light':'dark';
      document.documentElement.dataset.theme=S.tema; save(); render(); break;
    case 'export': exportar(el.dataset.f); break;
    case 'reseed':
      if(confirm('¿Restaurar los datos de ejemplo? Se reemplaza lo que cargaste.')){ S=seed(); save(); view='inicio'; render(); toast('Datos de ejemplo restaurados'); }
      break;
    case 'wipe':
      if(confirm('¿Borrar todos los movimientos y metas? No se puede deshacer.')){
        S={user:{nombre:S.user.nombre},tema:S.tema,tx:[],metas:[],presu:{},vistos:[]}; save(); view='inicio'; render(); toast('Datos borrados');
      }
      break;
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

function mBienvenida(){
  sheet('GastoSmart',
    '<p style="font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:-4px 0 0">Esta es una <b>demo navegable</b> de la app de control de gastos que estamos desarrollando. Funciona de verdad: podés cargar gastos, editar presupuestos y crear metas de ahorro.</p>'+
    '<div class="card pad" style="margin-top:14px;border:0;box-shadow:none;background:var(--green-soft)"><ul class="tight" style="margin:0;color:var(--green-600)">'+
      '<li>Arranca con datos de ejemplo para que veas todo funcionando.</li>'+
      '<li>Tus cambios se guardan solo en este navegador, no se envían a ningún servidor.</li>'+
      '<li>Escribí "Netflix", "Uber" o "Carrefour" al cargar un gasto y mirá qué pasa con la categoría.</li>'+
    '</ul></div>'+
    '<div style="margin-top:18px"><button class="btn" data-act="empezar">Entrar a la demo</button></div>'+
    '<p class="muted" style="font-size:11.5px;text-align:center;margin:12px 0 0">Grupo QWERTY123 · Metodología de Sistemas</p>');
}

load(); render();
if(!S.bienvenida) mBienvenida();
</script>
